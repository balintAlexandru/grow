# Started by the button on the site (POST /api/generate), or by hand from the Actions tab.
name: learning-daily

on:
  workflow_dispatch:

concurrency:
  group: content-learning
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    uses: ./.github/workflows/run-skill.yml
    with:
      skill: learning-daily
      content: app/src/content/learning
      # Today's plan plus a new lesson in every other area (spec 0006).
      args: tot
    secrets: inherit
