# Started by the button on the site (POST /api/generate), or by hand from the Actions tab.
name: fashion-refresh

on:
  workflow_dispatch:

concurrency:
  group: content-fashion
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    uses: ./.github/workflows/run-skill.yml
    with:
      skill: fashion-refresh
      content: app/src/content/fashion
    secrets: inherit
