# Started by the button on the site (POST /api/generate), or by hand from the Actions tab.
name: psychology-refresh

on:
  workflow_dispatch:

concurrency:
  group: content-psychology
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    uses: ./.github/workflows/run-skill.yml
    with:
      skill: psychology-refresh
      content: app/src/content/psychology
    secrets: inherit
