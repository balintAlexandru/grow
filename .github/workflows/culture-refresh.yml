# Started by the button on the site (POST /api/generate), or by hand from the Actions tab.
name: culture-refresh

on:
  workflow_dispatch:

concurrency:
  group: content-culture
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    uses: ./.github/workflows/run-skill.yml
    with:
      skill: culture-refresh
      content: app/src/content/culture
    secrets: inherit
